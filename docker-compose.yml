version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: accessai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: accessai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accessai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: accessai-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PORT: 8000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/accessai
      LLM_PROVIDER: mock
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
    volumes:
      - ./apps/api:/workspace/apps/api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: accessai-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next

volumes:
  postgres_data:
